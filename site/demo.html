<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Demo · Either side of the line</title>
<meta name="robots" content="noindex">
<!-- The kiosk tour is now the event pages' demo mode: this forwards old links (demo.html?e=<slug>) there. -->
<meta http-equiv="refresh" content="0; url=./">
<script>
  try { sessionStorage.setItem("nisar.demo", "1"); } catch {}
  const e = new URLSearchParams(location.search).get("e");
  location.replace(e && /^[\w-]+$/.test(e) ? `e/${e}.html` : "./");
</script>
<p><a href="./">Continue to the tour</a></p>
</html>
